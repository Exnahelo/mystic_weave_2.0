openapi: 3.1.0
info:
  title: Mystic Weave
  description: Persistent game state backend for a text-based RPG powered by a custom
    GPT. The GPT is the narrator; this API is the memory. d100 roll-under resolution
    with domain scores and competency tiers.
  version: 4.3.0
servers:
- url: https://mysticweave-production.up.railway.app
  description: Production (Railway)
paths:
  /state/{session_id}:
    get:
      summary: Load State
      description: Load the full game state for a session. Returns 404 if not found.
      operationId: load_state_state__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Save State
      description: Save game state, deep-merge character and world updates onto stored
        state, and append one log entry atomically.
      operationId: save_state_state__session_id__post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /state/{session_id}/delta:
    post:
      summary: Save State Delta
      description: Apply a validated structured state delta to stored game state,
        then append one log entry atomically.
      operationId: save_state_delta_state__session_id__delta_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyStateDeltaRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /session/new:
    post:
      summary: New Session
      description: 'Create a new game session.


        Seeds the character from local game system data using the provided

        ancestry, culture, focus, and background. Returns the session_id and initial

        character + world state.'
      operationId: new_session_session_new_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSessionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /character/create:
    post:
      summary: Create Character
      description: 'Seed a character from game system data and update the session''s
        character record.


        The session must already exist (created via POST /session/new).

        Returns 404 if the session is not found.'
      operationId: create_character_character_create_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCharacterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCharacterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /character/{session_id}/spend_ap:
    post:
      summary: Spend Ap
      description: 'Spend AP to raise a domain score. Earned AP can only be drawn
        from the target domain''s pool; awarded AP can be drawn for any domain. The
        two sources may be combined. Bracket costs apply point-by-point: 1 AP per
        point at scores 25-60, 2 AP at 61-70, 3 AP at 71-80.'
      operationId: spend_ap_character__session_id__spend_ap_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendAPRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendAPResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /roll:
    post:
      summary: Roll Dice
      description: Roll 1d100 against a target and return success state plus degree
        band.
      operationId: roll_dice_roll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /combat/compute_max_hp:
    post:
      tags:
      - combat
      summary: Compute Max Hp Endpoint
      description: Compute pre-combat HP from armor and shield catalog values plus
        skill tiers.
      operationId: compute_max_hp_endpoint_combat_compute_max_hp_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeMaxHpRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeMaxHpResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /combat/resolve_attack:
    post:
      tags:
      - combat
      summary: Resolve Attack Endpoint
      description: Resolve a single Combat v1.0 attack atomically using backend-authoritative
        dice.
      operationId: resolve_attack_endpoint_combat_resolve_attack_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAttackRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveAttackResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /location/{location_id}:
    get:
      summary: Get Location
      description: 'Load location data. The GPT must call this before describing any
        place.

        Returns 404 if the location does not exist in the database.'
      operationId: get_location_location__location_id__get
      parameters:
      - name: location_id
        in: path
        required: true
        schema:
          type: string
          title: Location Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /location:
    post:
      summary: Upsert Location
      description: Create or update a location via UPSERT, and persist valid world-graph
        connections from the payload.
      operationId: upsert_location_location_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationData'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '200':
          description: Location updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /location/{location_id}/connections:
    get:
      summary: Get Connections
      description: 'Return all valid movement options from the given location.


        The GPT may only move the player to locations listed here.

        Movement to unlisted locations is not permitted.'
      operationId: get_connections_location__location_id__connections_get
      parameters:
      - name: location_id
        in: path
        required: true
        schema:
          type: string
          title: Location Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /options:
    get:
      tags:
      - options
      summary: Get Options
      description: 'Return creation options only: ancestries, cultures, focus, backgrounds.


        Use this at character creation. Do not invent or enumerate choices from

        memory. Runtime catalogs live under /catalog/*.'
      operationId: get_options_options_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
  /catalog/items:
    get:
      tags:
      - catalog
      summary: Get Item Catalog
      description: 'Return one runtime item catalog.


        `kind` is required so clients cannot accidentally request the full combined

        catalog and exceed response-size caps.'
      operationId: get_item_catalog_catalog_items_get
      parameters:
      - name: kind
        in: query
        required: true
        schema:
          enum:
          - mundane
          - magical
          - apparel
          - weapon
          - armor
          - ammunition
          type: string
          description: 'Required. Which item catalog to return: mundane, magical,
            apparel, weapon, armor, or ammunition.'
          title: Kind
        description: 'Required. Which item catalog to return: mundane, magical, apparel,
          weapon, armor, or ammunition.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCatalogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /catalog/creatures:
    get:
      tags:
      - catalog
      summary: Get Creature Catalog
      description: Return creature and exceptional companion catalogs.
      operationId: get_creature_catalog_catalog_creatures_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureCatalogResponse'
  /catalog/vocab:
    get:
      tags:
      - catalog
      summary: Get Companion Vocab
      description: Return companion vocab lists and enum literals.
      operationId: get_companion_vocab_catalog_vocab_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionVocabResponse'
  /scene/{session_id}:
    get:
      summary: Get Scene Context
      description: Build and return compact scene context from persisted state and
        current location for narration input.
      operationId: get_scene_context_scene__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneContext'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tags:
    get:
      tags:
      - tags
      summary: Get Tags
      description: 'Return the canonical tag vocabularies: knowledge groups, magic
        fields, applications.'
      operationId: get_tags_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
  /companion/new:
    post:
      summary: Create Companion
      operationId: create_companion_companion_new_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /companion/{companion_id}/transition:
    post:
      summary: Transition Companion
      operationId: transition_companion_companion__companion_id__transition_post
      parameters:
      - name: companion_id
        in: path
        required: true
        schema:
          type: string
          title: Companion Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionCompanionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /companion/{companion_id}:
    get:
      summary: Get Companion
      operationId: get_companion_companion__companion_id__get
      parameters:
      - name: companion_id
        in: path
        required: true
        schema:
          type: string
          title: Companion Id
      - name: session_id
        in: query
        required: true
        schema:
          type: string
          title: Session Id
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /npcs:
    get:
      tags:
      - npcs
      summary: Get Npcs
      description: Return NPC registry entries. Use `tier=named` for tier 1-2 individuals,
        `tier=roles` for tier 3 role templates, or omit for both.
      operationId: get_npcs_npcs_get
      parameters:
      - name: tier
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by tier category: ''named'' (tier 1-2) or ''roles''
            (tier 3). Omit for all.'
          title: Tier
        description: 'Filter by tier category: ''named'' (tier 1-2) or ''roles'' (tier
          3). Omit for all.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NpcRegistryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      tags:
      - health
      summary: Root
      description: "Root \u2014 confirms the API is running."
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health:
    get:
      tags:
      - health
      summary: Health Check
      description: "Health check endpoint \u2014 used by Railway and uptime monitors."
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /version:
    get:
      tags:
      - health
      summary: Version
      description: Deployment/version metadata for sanity checks across environments.
      operationId: version_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
components:
  schemas:
    AdjustmentPoints:
      properties:
        power:
          type: integer
          title: Power
          default: 0
        agility:
          type: integer
          title: Agility
          default: 0
        perception:
          type: integer
          title: Perception
          default: 0
        endurance:
          type: integer
          title: Endurance
          default: 0
        intellect:
          type: integer
          title: Intellect
          default: 0
        will:
          type: integer
          title: Will
          default: 0
        presence:
          type: integer
          title: Presence
          default: 0
      type: object
      title: AdjustmentPoints
      description: Player's +10 domain adjustment pool at creation. Max +5 per domain.
    AdvancementState:
      properties:
        points_available_earned:
          additionalProperties:
            type: integer
          type: object
          title: Points Available Earned
          description: 'Per-domain earned AP pools. Keys: power, agility, perception,
            endurance, intellect, will, presence.'
        points_available_awarded:
          type: integer
          title: Points Available Awarded
          default: 0
        points_spent:
          type: integer
          title: Points Spent
          default: 0
        points_earned_total:
          type: integer
          title: Points Earned Total
          default: 0
        tag_advance_counters:
          additionalProperties:
            type: integer
          type: object
          title: Tag Advance Counters
          description: Per-domain counters; tag advances increment these. At 3, convert
            to +1 earned AP in that domain.
      type: object
      title: AdvancementState
      description: 'Per-domain earned AP pools, single awarded AP pool, lifetime totals,

        and per-domain tag advancement counters.


        Earned AP is locked to its source domain (each domain has its own pool).

        Awarded AP is free-allocation across any domain (single pool).

        Counters track tag advances per domain; every 3 advances in a domain

        converts to +1 earned AP in that domain.'
    Alignment:
      properties:
        order:
          $ref: '#/components/schemas/AlignmentOrder'
          default: neutral
        intent:
          $ref: '#/components/schemas/AlignmentIntent'
          default: neutral
        ethos_note:
          type: string
          title: Ethos Note
          default: ''
      type: object
      title: Alignment
    AlignmentIntent:
      type: string
      enum:
      - good
      - neutral
      - evil
      title: AlignmentIntent
    AlignmentOrder:
      type: string
      enum:
      - lawful
      - neutral
      - chaotic
      title: AlignmentOrder
    AncestryOption:
      properties:
        index:
          type: string
          title: Index
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
          default: ''
        primary_domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Domain
        domains:
          additionalProperties:
            type: integer
          type: object
          title: Domains
        traits:
          items:
            $ref: '#/components/schemas/AncestryTrait'
          type: array
          title: Traits
      type: object
      required:
      - index
      - name
      - domains
      title: AncestryOption
    AncestryTrait:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
        description:
          type: string
          title: Description
        mechanical_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Mechanical Note
        application_tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Application Tag
        roll_domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Roll Domain
        usage:
          anyOf:
          - type: string
          - type: 'null'
          title: Usage
        fatigue:
          anyOf:
          - type: string
          - type: 'null'
          title: Fatigue
      type: object
      required:
      - name
      - type
      - description
      title: AncestryTrait
    ApplicationEntry:
      properties:
        index:
          type: string
          title: Index
        name:
          type: string
          title: Name
        group:
          type: string
          title: Group
        primary_domain:
          type: string
          title: Primary Domain
        domain_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain Note
        description:
          type: string
          title: Description
        examples:
          items:
            type: string
          type: array
          title: Examples
      type: object
      required:
      - index
      - name
      - group
      - primary_domain
      - description
      title: ApplicationEntry
    ApplyStateDeltaRequest:
      properties:
        character:
          $ref: '#/components/schemas/CharacterStateDelta'
        world:
          $ref: '#/components/schemas/WorldStateDelta'
        log_entry:
          type: string
          title: Log Entry
      additionalProperties: false
      type: object
      required:
      - log_entry
      title: ApplyStateDeltaRequest
      description: Body for POST /state/{session_id}/delta
    ArchivedCompanionEnvelope-Input:
      properties:
        id:
          type: string
          title: Id
        companion:
          oneOf:
          - $ref: '#/components/schemas/SapientCompanion-Input'
          - $ref: '#/components/schemas/CreatureCompanion'
          - $ref: '#/components/schemas/ExceptionalCompanion-Input'
          title: Companion
          discriminator:
            propertyName: tier
            mapping:
              creature: '#/components/schemas/CreatureCompanion'
              exceptional: '#/components/schemas/ExceptionalCompanion-Input'
              sapient: '#/components/schemas/SapientCompanion-Input'
        archived_at:
          type: string
          title: Archived At
      additionalProperties: false
      type: object
      required:
      - id
      - companion
      - archived_at
      title: ArchivedCompanionEnvelope
    ArchivedCompanionEnvelope-Output:
      properties:
        id:
          type: string
          title: Id
        companion:
          oneOf:
          - $ref: '#/components/schemas/SapientCompanion-Output'
          - $ref: '#/components/schemas/CreatureCompanion'
          - $ref: '#/components/schemas/ExceptionalCompanion-Output'
          title: Companion
          discriminator:
            propertyName: tier
            mapping:
              creature: '#/components/schemas/CreatureCompanion'
              exceptional: '#/components/schemas/ExceptionalCompanion-Output'
              sapient: '#/components/schemas/SapientCompanion-Output'
        archived_at:
          type: string
          title: Archived At
      additionalProperties: false
      type: object
      required:
      - id
      - companion
      - archived_at
      title: ArchivedCompanionEnvelope
    BackgroundOption:
      properties:
        index:
          type: string
          title: Index
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
          default: ''
        domain_bonuses:
          additionalProperties:
            type: integer
          type: object
          title: Domain Bonuses
        knowledge_tags:
          additionalProperties:
            type: integer
          type: object
          title: Knowledge Tags
        application_tags:
          additionalProperties:
            type: integer
          type: object
          title: Application Tags
        field_tags:
          additionalProperties:
            type: integer
          type: object
          title: Field Tags
      type: object
      required:
      - index
      - name
      title: BackgroundOption
    BondLinks:
      properties:
        primary:
          type: string
          title: Primary
        secondary:
          anyOf:
          - type: string
          - type: 'null'
          title: Secondary
      additionalProperties: false
      type: object
      required:
      - primary
      title: BondLinks
    CharacterModel-Input:
      properties:
        name:
          type: string
          title: Name
        ancestry:
          type: string
          title: Ancestry
        draconic_traits:
          items:
            type: string
          type: array
          title: Draconic Traits
        culture:
          type: string
          title: Culture
        focus:
          type: string
          title: Focus
        background:
          type: string
          title: Background
        hp:
          $ref: '#/components/schemas/HP'
        domains:
          $ref: '#/components/schemas/DomainScores'
        knowledge:
          additionalProperties:
            type: integer
          type: object
          title: Knowledge
        application:
          additionalProperties:
            type: integer
          type: object
          title: Application
        fields:
          additionalProperties:
            type: integer
          type: object
          title: Fields
        status_effects:
          items:
            type: string
          type: array
          title: Status Effects
        notes:
          type: string
          title: Notes
          default: ''
        identity:
          $ref: '#/components/schemas/Identity-Input'
        equipment:
