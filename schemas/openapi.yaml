openapi: 3.1.0
info:
  title: Mystic Weave
  description: Persistent game state backend for a text-based RPG powered by a custom
    GPT. The GPT is the narrator; this API is the memory. d100 roll-under resolution
    with domain scores and competency tiers.
  version: 3.2.0
servers:
- url: https://mysticweave-production.up.railway.app
  description: Production (Railway)
paths:
  /state/{session_id}:
    get:
      summary: Load State
      description: Load the full game state for a session. Returns 404 if not found.
      operationId: load_state_state__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Save State
      description: Save full game state, deep-merge character updates, replace world state, and append one log entry atomically.
      operationId: save_state_state__session_id__post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /session/new:
    post:
      summary: New Session
      description: 'Create a new game session.


        Seeds the character from local game system data using the provided

        species, focus, and background. Returns the session_id and initial

        character + world state.'
      operationId: new_session_session_new_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSessionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /character/create:
    post:
      summary: Create Character
      description: 'Seed a character from game system data and update the session''s
        character record.


        The session must already exist (created via POST /session/new).

        Returns 404 if the session is not found.'
      operationId: create_character_character_create_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCharacterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCharacterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /roll:
    post:
      summary: Roll Dice
      description: 'Roll 1d100 against the target number and return the result with

        degree of success.


        Critical rules (non-negotiable):

        - Roll 1 is always critical success regardless of target.

        - Roll 100 is always critical failure regardless of target.'
      operationId: roll_dice_roll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /location/{location_id}:
    get:
      summary: Get Location
      description: 'Load location data. The GPT must call this before describing any
        place.

        Returns 404 if the location does not exist in the database.'
      operationId: get_location_location__location_id__get
      parameters:
      - name: location_id
        in: path
        required: true
        schema:
          type: string
          title: Location Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /location:
    post:
      summary: Upsert Location
      description: Create or update a location via UPSERT and persist any provided world-graph connections.
      operationId: upsert_location_location_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationData'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '200':
          description: Location updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /location/{location_id}/connections:
    get:
      summary: Get Connections
      description: 'Return all valid movement options from the given location.


        The GPT may only move the player to locations listed here.

        Movement to unlisted locations is not permitted.'
      operationId: get_connections_location__location_id__connections_get
      parameters:
      - name: location_id
        in: path
        required: true
        schema:
          type: string
          title: Location Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /options:
    get:
      tags:
      - options
      summary: Get Options
      description: 'Return all supported species, focus archetypes, and backgrounds.


        Call this before asking the player to choose species, focus, or background.

        Only present options returned by this endpoint — do not offer any options

        not listed here. Never enumerate from memory.'
      operationId: get_options_options_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
  /:
    get:
      tags:
      - health
      summary: Root
      description: Root — confirms the API is running.
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                title: Response Root  Get
  /health:
    get:
      tags:
      - health
      summary: Health Check
      description: Health check endpoint — used by Railway and uptime monitors.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                title: Response Health Check Health Get
  /version:
    get:
      tags:
      - health
      summary: Version
      description: Deployment/version metadata for sanity checks across environments.
      operationId: version_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  api_version:
                    type: string
                  git_sha:
                    type: string
                  data_fingerprint:
                    type: string
                  species_count:
                    type: integer
                  focus_count:
                    type: integer
                  backgrounds_count:
                    type: integer
                title: Response Version Version Get
components:
  schemas:
    AdjustmentPoints:
      properties:
        power:
          type: integer
          title: Power
          default: 0
        agility:
          type: integer
          title: Agility
          default: 0
        perception:
          type: integer
          title: Perception
          default: 0
        endurance:
          type: integer
          title: Endurance
          default: 0
        intellect:
          type: integer
          title: Intellect
          default: 0
        will:
          type: integer
          title: Will
          default: 0
        presence:
          type: integer
          title: Presence
          default: 0
      type: object
      title: AdjustmentPoints
      description: Player's +5 domain adjustment pool at creation. Max +3 per domain.
    AdvancementState:
      properties:
        points_available:
          type: integer
          title: Points Available
          default: 0
        points_spent:
          type: integer
          title: Points Spent
          default: 0
        points_earned_total:
          type: integer
          title: Points Earned Total
          default: 0
      type: object
      title: AdvancementState
    Alignment:
      properties:
        order:
          $ref: '#/components/schemas/AlignmentOrder'
          default: neutral
        intent:
          $ref: '#/components/schemas/AlignmentIntent'
          default: neutral
        ethos_note:
          type: string
          title: Ethos Note
          default: ''
      type: object
      title: Alignment
    AlignmentIntent:
      type: string
      enum:
      - good
      - neutral
      - evil
      title: AlignmentIntent
    AlignmentOrder:
      type: string
      enum:
      - lawful
      - neutral
      - chaotic
      title: AlignmentOrder
    BackgroundOption:
      properties:
        index:
          type: string
          title: Index
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
          default: ''
        knowledge_tags:
          additionalProperties:
            type: integer
          type: object
          title: Knowledge Tags
        application_tags:
          additionalProperties:
            type: integer
          type: object
          title: Application Tags
      type: object
      required:
      - index
      - name
      title: BackgroundOption
    CharacterModel-Input:
      properties:
        name:
          type: string
          title: Name
        species:
          type: string
          title: Species
        focus:
          type: string
          title: Focus
        background:
          type: string
          title: Background
        hp:
          $ref: '#/components/schemas/HP'
        domains:
          $ref: '#/components/schemas/DomainScores'
        knowledge:
          additionalProperties:
            type: integer
          type: object
          title: Knowledge
        application:
          additionalProperties:
            type: integer
          type: object
          title: Application
        status_effects:
          items:
            type: string
          type: array
          title: Status Effects
        notes:
          type: string
          title: Notes
          default: ''
        identity:
          $ref: '#/components/schemas/Identity-Input'
        equipment:
          $ref: '#/components/schemas/Equipment-Input'
        reputation:
          items:
            $ref: '#/components/schemas/ReputationEntry'
          type: array
          title: Reputation
        advancement:
          $ref: '#/components/schemas/AdvancementState'
        level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Level
          description: Deprecated legacy field.
        magic_fields:
          items:
            type: string
          type: array
          title: Magic Fields
        draconic_traits:
          items:
            type: string
          type: array
          title: Draconic Traits
      additionalProperties: false
      type: object
      required:
      - name
      - species
      - focus
      - background
      - hp
      - domains
      title: CharacterModel
    CharacterModel-Output:
      properties:
        name:
          type: string
          title: Name
        species:
          type: string
          title: Species
        focus:
          type: string
          title: Focus
        background:
          type: string
          title: Background
        hp:
          $ref: '#/components/schemas/HP'
        domains:
          $ref: '#/components/schemas/DomainScores'
        knowledge:
          additionalProperties:
            type: integer
          type: object
          title: Knowledge
        application:
          additionalProperties:
            type: integer
          type: object
          title: Application
        status_effects:
          items:
            type: string
          type: array
          title: Status Effects
        notes:
          type: string
          title: Notes
          default: ''
        identity:
          $ref: '#/components/schemas/Identity-Output'
        equipment:
          $ref: '#/components/schemas/Equipment-Output'
        reputation:
          items:
            $ref: '#/components/schemas/ReputationEntry'
          type: array
          title: Reputation
        advancement:
          $ref: '#/components/schemas/AdvancementState'
        level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Level
          description: Deprecated legacy field.
        magic_fields:
          items:
            type: string
          type: array
          title: Magic Fields
        draconic_traits:
          items:
            type: string
          type: array
          title: Draconic Traits
      additionalProperties: false
      type: object
      required:
      - name
      - species
      - focus
      - background
      - hp
      - domains
      title: CharacterModel
    CompanionModel-Input:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        species:
          type: string
          title: Species
          default: unknown
        role:
          type: string
          title: Role
          default: ''
        identity:
          $ref: '#/components/schemas/Identity-Input'
        hp:
          $ref: '#/components/schemas/HP'
        domains:
          anyOf:
          - $ref: '#/components/schemas/DomainScores'
          - type: 'null'
        knowledge:
          additionalProperties:
            type: integer
          type: object
          title: Knowledge
        application:
          additionalProperties:
            type: integer
          type: object
          title: Application
        status:
          $ref: '#/components/schemas/CompanionStatus'
          default: active
        disposition:
          type: integer
          title: Disposition
          default: 0
        reputation:
          items:
            $ref: '#/components/schemas/ReputationEntry'
          type: array
          title: Reputation
      additionalProperties: false
      type: object
      required:
      - id
      - name
      title: CompanionModel
      description: "Lightweight companion schema. Not a full PC — no focus/background\
        \ mechanics.\nDomains and tags are optional; include only if the companion\
        \ participates\nin rolls. Status defaults to active.\n\nParty reputation formula\
        \ (computed by GPT at resolution time, not stored):\n  known_avg  = mean(standing\
        \ for members with an entry for the faction)\n  ratio      = known_count /\
        \ total_party_size\n  party_rep  = known_avg × ratio"
    CompanionModel-Output:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        species:
          type: string
          title: Species
          default: unknown
        role:
          type: string
          title: Role
          default: ''
        identity:
          $ref: '#/components/schemas/Identity-Output'
        hp:
          $ref: '#/components/schemas/HP'
        domains:
          anyOf:
          - $ref: '#/components/schemas/DomainScores'
          - type: 'null'
        knowledge:
          additionalProperties:
            type: integer
          type: object
          title: Knowledge
        application:
          additionalProperties:
            type: integer
          type: object
          title: Application
        status:
          $ref: '#/components/schemas/CompanionStatus'
          default: active
        disposition:
          type: integer
          title: Disposition
          default: 0
        reputation:
          items:
            $ref: '#/components/schemas/ReputationEntry'
          type: array
          title: Reputation
      additionalProperties: false
      type: object
      required:
      - id
      - name
      title: CompanionModel
      description: "Lightweight companion schema. Not a full PC — no focus/background\
        \ mechanics.\nDomains and tags are optional; include only if the companion\
        \ participates\nin rolls. Status defaults to active.\n\nParty reputation formula\
        \ (computed by GPT at resolution time, not stored):\n  known_avg  = mean(standing\
        \ for members with an entry for the faction)\n  ratio      = known_count /\
        \ total_party_size\n  party_rep  = known_avg × ratio"
    CompanionStatus:
      type: string
      enum:
      - active
      - incapacitated
      - departed
      title: CompanionStatus
    ConnectionInfo:
      properties:
        to_id:
          type: string
          title: To Id
        traversal:
          anyOf:
          - type: string
          - type: 'null'
          title: Traversal
        distance:
          anyOf:
          - type: string
          - type: 'null'
          title: Distance
      type: object
      required:
      - to_id
      title: ConnectionInfo
    ConnectionsResponse:
      properties:
        from_id:
          type: string
          title: From Id
        connections:
          items:
            $ref: '#/components/schemas/ConnectionInfo'
          type: array
          title: Connections
      type: object
      required:
      - from_id
      - connections
      title: ConnectionsResponse
    CreateCharacterRequest:
      properties:
        session_id:
          type: string
          title: Session Id
        name:
          type: string
          title: Name
        species:
          type: string
          title: Species
        focus:
          type: string
          title: Focus
        background:
          type: string
          title: Background
        adjustment_points:
          $ref: '#/components/schemas/AdjustmentPoints'
        identity:
          $ref: '#/components/schemas/Identity-Input'
      type: object
      required:
      - session_id
      - name
      - species
      - focus
      - background
      title: CreateCharacterRequest
      description: Body for POST /character/create — seeds character from game system
        data.
    CreateCharacterResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        character:
          $ref: '#/components/schemas/CharacterModel-Output'
      type: object
      required:
      - session_id
      - character
      title: CreateCharacterResponse
    DomainScores:
      properties:
        power:
          type: integer
          title: Power
        agility:
          type: integer
          title: Agility
        perception:
          type: integer
          title: Perception
        endurance:
          type: integer
          title: Endurance
        intellect:
          type: integer
          title: Intellect
        will:
          type: integer
          title: Will
        presence:
          type: integer
          title: Presence
      type: object
      required:
      - power
      - agility
      - perception
      - endurance
      - intellect
      - will
      - presence
      title: DomainScores
    Economy:
      properties:
        wealth_tier:
          $ref: '#/components/schemas/WealthTier'
          default: modest
        coin:
          type: integer
          title: Coin
          default: 0
        trade_goods:
          items:
            type: string
          type: array
          title: Trade Goods
        obligations:
          items:
            type: string
          type: array
          title: Obligations
      type: object
      title: Economy
      description: 'Economic state. wealth_tier is the universal abstraction (works
        for barter

        and currency economies alike). coin is stored as total Copper Drakes (CD)

        as a raw integer for regions that use hard currency (e.g. outside

        Drakenvale via the SSTC). 100 CD = 1 GD.'
    Equipment-Input:
      properties:
        worn:
          items:
            $ref: '#/components/schemas/EquipmentItem'
          type: array
          title: Worn
        carried:
          items:
            $ref: '#/components/schemas/EquipmentItem'
          type: array
          title: Carried
        stashed:
          items:
            $ref: '#/components/schemas/EquipmentItem'
          type: array
          title: Stashed
      type: object
      title: Equipment
      description: Three-slot equipment inventory.
    Equipment-Output:
      properties:
        worn:
          items:
            $ref: '#/components/schemas/EquipmentItem'
          type: array
          title: Worn
        carried:
          items:
            $ref: '#/components/schemas/EquipmentItem'
          type: array
          title: Carried
        stashed:
          items:
            $ref: '#/components/schemas/EquipmentItem'
          type: array
          title: Stashed
      type: object
      title: Equipment
      description: Three-slot equipment inventory.
    EquipmentItem:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
          default: ''
        tags:
          items:
            $ref: '#/components/schemas/EquipmentTag'
          type: array
          title: Tags
        roll_tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Roll Tag
      type: object
      required:
      - id
      - name
      title: EquipmentItem
      description: Single item in any equipment slot.
    EquipmentTag:
      type: string
      enum:
      - utility
      - weapon
      - armor
      - consumable
      - arcane
      - sacred
      - trade_good
      - special
      title: EquipmentTag
    FocusOption:
      properties:
        index:
          type: string
          title: Index
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
          default: ''
        knowledge_tags:
          additionalProperties:
            type: integer
          type: object
          title: Knowledge Tags
        application_tags:
          additionalProperties:
            type: integer
          type: object
          title: Application Tags
      type: object
      required:
      - index
      - name
      title: FocusOption
    GameStateResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        character:
          $ref: '#/components/schemas/CharacterModel-Output'
        world:
          $ref: '#/components/schemas/WorldModel-Output'
        log:
          items:
            type: string
          type: array
          title: Log
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - session_id
      - character
      - world
      - log
      title: GameStateResponse
      description: Response for GET /state/{session_id}
    HP:
      properties:
        current:
          type: integer
          title: Current
        max:
          type: integer
          title: Max
          default: 100
      type: object
      required:
      - current
      title: HP
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Identity-Input:
      properties:
        origin:
          type: string
          title: Origin
          default: ''
        motivations:
          items:
            type: string
          type: array
          title: Motivations
        quirks:
          items:
            type: string
          type: array
          title: Quirks
        bonds:
          items:
            type: string
          type: array
          title: Bonds
        flaws:
          items:
            type: string
          type: array
          title: Flaws
        wound:
          type: string
          title: Wound
          default: ''
        alignment:
          $ref: '#/components/schemas/Alignment'
      type: object
      title: Identity
      description: 'Narrative character block. Captured at creation, GPT-readable
        every session.

        All fields optional at creation — can be filled in as play reveals them.'
    Identity-Output:
      properties:
        origin:
          type: string
          title: Origin
          default: ''
        motivations:
          items:
            type: string
          type: array
          title: Motivations
        quirks:
          items:
            type: string
          type: array
          title: Quirks
        bonds:
          items:
            type: string
          type: array
          title: Bonds
        flaws:
          items:
            type: string
          type: array
          title: Flaws
        wound:
          type: string
          title: Wound
          default: ''
        alignment:
          $ref: '#/components/schemas/Alignment'
      type: object
      title: Identity
      description: 'Narrative character block. Captured at creation, GPT-readable
        every session.

        All fields optional at creation — can be filled in as play reveals them.'
    ItemOption:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        category:
          type: string
          title: Category
        description:
          type: string
          title: Description
          default: ''
        tags:
          items:
            type: string
          type: array
          title: Tags
        roll_tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Roll Tag
        consumable:
          type: boolean
          title: Consumable
          default: false
        charges:
          anyOf:
          - type: integer
          - type: 'null'
          title: Charges
        rarity:
          type: string
          title: Rarity
          default: common
        value_cd:
          type: integer
          title: Value Cd
          default: 0
        effects:
          items:
            type: string
          type: array
          title: Effects
      type: object
      required:
      - id
      - name
      - category
      title: ItemOption
