openapi: 3.1.1
info:
  title: Mystic Weave
  description: >
    Persistent game state backend for a text-based RPG powered by a custom GPT.
    The GPT is the narrator and game master. This API is the memory.
    Uses d100 roll-under resolution with domain scores, knowledge tiers,
    and application tiers.
  version: 3.1.0

servers:
  - url: https://mysticweave-production.up.railway.app
    description: Production (Railway)

paths:

  /health:
    get:
      operationId: health
      summary: Health check
      description: Returns ok if the service is running.
      tags:
        - health
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: mystic-weave

  /options:
    get:
      operationId: getOptions
      summary: List supported species, focus archetypes, and backgrounds
      description: >
        Returns all supported species, focus archetypes, and backgrounds.
        Call before presenting creation choices. Only present options returned here —
        never enumerate from memory or training data.
      tags:
        - options
      responses:
        "200":
          description: Supported species, focus archetypes, and backgrounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionsResponse"

  /state/{session_id}:
    get:
      operationId: loadState
      summary: Load game state
      description: >
        Load the full game state for a session. Call this at the start of every
        session to restore character, world, and log history. Returns 404 if the
        session does not exist.
      tags:
        - state
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: The session identifier returned by POST /session/new
      responses:
        "200":
          description: Full game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStateResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: saveState
      summary: Save game state
      description: >
        Save the full game state after each turn and append a one-sentence log entry.
        Uses UPSERT — works for both first save and subsequent saves.
        Call this at the end of every turn without exception.
      tags:
        - state
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveStateRequest"
      responses:
        "200":
          description: State saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStateResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/new:
    post:
      operationId: newSession
      summary: Create a new game session
      description: >
        Creates a new session and seeds a character from the provided species,
        focus archetype, and background. Returns the session_id and initial state.
      tags:
        - session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewSessionResponse"
        "422":
          description: Invalid character options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /character/create:
    post:
      operationId: createCharacter
      summary: Re-seed a character into an existing session
      description: >
        Replaces the character in an existing session with a newly seeded character.
        The session must already exist.
      tags:
        - character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "200":
          description: Character created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCharacterResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid character options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /roll:
    post:
      operationId: rollDice
      summary: Authoritative d100 dice resolution
      description: >
        Roll 1d100 against the provided target number.
        The GPT assembles the target from domain score + knowledge tier +
        application tier + difficulty modifier, then sends it here.
        The server rolls. The GPT narrates. Returns the roll, success/failure,
        margin, and degree of success band.
      tags:
        - dice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollRequest"
      responses:
        "200":
          description: Roll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollResponse"

  /location/{id}:
    get:
      operationId: getLocation
      summary: Load location data
      description: >
        Load the full data for a location by ID. Call this before describing
        any location to the player. You may add sensory flavor but you may not
        contradict any field in the record.
      tags:
        - location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Location data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /location/{id}/connections:
    get:
      operationId: getLocationConnections
      summary: Get valid movement options
      description: >
        Returns the list of locations connected to the given location.
        Only present these as movement options — the player cannot move
        to unconnected locations.
      tags:
        - location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connected locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionsResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /location:
    post:
      operationId: upsertLocation
      summary: Create or update a location
      description: >
        Create a new location or update an existing one. Use this when
        discovering a new location or when updating details of a known location.
      tags:
        - location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationData"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"

components:
  schemas:

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string

    # ---------------------------------------------------------------------------
    # Shared primitives
    # ---------------------------------------------------------------------------

    HP:
      type: object
      required: [current, max]
      properties:
        current:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 1
          default: 100

    DomainScores:
      type: object
      required: [power, agility, perception, endurance, intellect, will, presence]
      properties:
        power:
          type: integer
          minimum: 1
          maximum: 60
        agility:
          type: integer
          minimum: 1
          maximum: 60
        perception:
          type: integer
          minimum: 1
          maximum: 60
        endurance:
          type: integer
          minimum: 1
          maximum: 60
        intellect:
          type: integer
          minimum: 1
          maximum: 60
        will:
          type: integer
          minimum: 1
          maximum: 60
        presence:
          type: integer
          minimum: 1
          maximum: 60

    # ---------------------------------------------------------------------------
    # Narrative / identity schemas (v3.1.0)
    # ---------------------------------------------------------------------------

    Alignment:
      type: object
      description: >
        Two-axis alignment. order = lawful/neutral/chaotic.
        intent = good/neutral/evil. ethos_note is freeform flavor text
        the GPT uses to inform consistent character behaviour.
      properties:
        order:
          type: string
          enum: [lawful, neutral, chaotic]
          default: neutral
        intent:
          type: string
          enum: [good, neutral, evil]
          default: neutral
        ethos_note:
          type: string
          default: ""

    Identity:
      type: object
      description: >
        Narrative character block. All fields optional — fill in at creation
        and refine through play. The GPT reads this every session to inform
        consistent behaviour and narration texture.
      properties:
        origin:
          type: string
          default: ""
          description: Where the character came from; formative history.
        motivations:
          type: array
          items:
            type: string
          maxItems: 3
          default: []
          description: 1–3 driving goals.
        quirks:
          type: array
          items:
            type: string
          maxItems: 3
          default: []
          description: 1–3 behavioural traits or mannerisms.
        bonds:
          type: array
          items:
            type: string
          maxItems: 3
          default: []
          description: People, places, or things the character is tied to.
        flaws:
          type: array
          items:
            type: string
          maxItems: 3
          default: []
          description: Weaknesses, biases, or blind spots.
        wound:
          type: string
          default: ""
          description: Notable formative scar or event.
        alignment:
          $ref: "#/components/schemas/Alignment"

    ReputationEntry:
      type: object
      description: >
        Standing with a single faction or community.
        A missing entry means the faction has no opinion yet (unknown).
        Range: -100 (despised) to +100 (revered).
        Party reputation is computed by the GPT at resolution time:
          known_avg = mean standing of party members who have an entry for the faction.
          ratio     = known_count / total_party_size.
          party_rep = known_avg × ratio.
        Unknown members are excluded from the average, not treated as zero.
      required: [faction]
      properties:
        faction:
          type: string
          description: >
            Faction ID. Use snake_case. Known factions: draconic_council,
            silver_scale_trading_company, order_of_the_platinum_flame,
            amethyst_veil, dragon_guard, cult_of_tiamat.
        standing:
          type: integer
          minimum: -100
          maximum: 100
          default: 0
        note:
          type: string
          default: ""
          description: Reason for current standing or context.
        last_change:
          type: string
          default: ""
          description: Brief description of the event that last moved standing.

    # ---------------------------------------------------------------------------
    # Equipment schemas (v3.1.0)
    # ---------------------------------------------------------------------------

    EquipmentItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          default: ""
        tags:
          type: array
          items:
            type: string
            enum: [utility, weapon, armor, consumable, arcane, sacred, trade_good, special]
          default: []
        roll_tag:
          type: string
          nullable: true
          default: null
          description: >
            Optional link to an application tag (e.g. "light_weapons").
            When present, the GPT may include this item as context
            when assembling a target number for relevant rolls.

    Equipment:
      type: object
      description: Three-slot inventory. worn = on person now. carried = in pack. stashed = at a known location.
      properties:
        worn:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentItem"
          default: []
        carried:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentItem"
          default: []
        stashed:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentItem"
          default: []

    # ---------------------------------------------------------------------------
    # Character model (updated v3.1.0)
    # ---------------------------------------------------------------------------

    CharacterModel:
      type: object
      required: [name, species, focus, background, hp, domains]
      properties:
        name:
          type: string
        species:
          type: string
          description: Species index (e.g. "human", "dragonborn")
        focus:
          type: string
          description: Focus archetype index (e.g. "devoted", "stalker")
        background:
          type: string
          description: Background index (e.g. "soldier", "acolyte")
        level:
          type: integer
          minimum: 1
          default: 1
        hp:
          $ref: "#/components/schemas/HP"
        domains:
          $ref: "#/components/schemas/DomainScores"
        knowledge:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 5
          default: {}
          description: >
            Knowledge tags. Keys are tag names (e.g. "discipline", "arcana"),
            values are tier numbers (1–5).
        application:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 5
          default: {}
          description: >
            Application tags. Keys are category names (e.g. "sacred_rites", "heavy_weapons"),
            values are tier numbers (1–5).
        status_effects:
          type: array
          items:
            type: string
          default: []
        notes:
          type: string
          default: ""
        # v3.1.0 additions
        identity:
          $ref: "#/components/schemas/Identity"
        equipment:
          $ref: "#/components/schemas/Equipment"
        reputation:
          type: array
          items:
            $ref: "#/components/schemas/ReputationEntry"
          default: []
          description: >
            Personal reputation entries keyed by faction ID.
            Missing entry = faction has no opinion (unknown).

    # ---------------------------------------------------------------------------
    # Companion model (v3.1.0)
    # ---------------------------------------------------------------------------

    CompanionModel:
      type: object
      required: [id, name]
      description: >
        Lightweight companion schema. Domains and tags are optional —
        include only if the companion participates in rolls.
        Disposition: -100 (hostile) to +100 (devoted) toward the player character.
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
          default: unknown
        role:
          type: string
          default: ""
          description: Narrative role, e.g. "scout", "healer", "guide".
        identity:
          $ref: "#/components/schemas/Identity"
        hp:
          $ref: "#/components/schemas/HP"
        domains:
          $ref: "#/components/schemas/DomainScores"
          nullable: true
          description: Omit for purely narrative companions.
        knowledge:
          type: object
          additionalProperties:
            type: integer
          default: {}
        application:
          type: object
          additionalProperties:
            type: integer
          default: {}
        status:
          type: string
          enum: [active, incapacitated, departed]
          default: active
        disposition:
          type: integer
          minimum: -100
          maximum: 100
          default: 0
          description: How the companion feels toward the player character.
        reputation:
          type: array
          items:
            $ref: "#/components/schemas/ReputationEntry"
          default: []

    # ---------------------------------------------------------------------------
    # Economy (v3.1.0)
    # ---------------------------------------------------------------------------

    Economy:
      type: object
      description: >
        Economic state. wealth_tier is the universal abstraction covering both
        Drakenvale's barter economy and currency economies outside it.
        coin is a raw integer for hard-currency regions only (e.g. SSTC trade routes).
      properties:
        wealth_tier:
          type: string
          enum: [destitute, modest, comfortable, wealthy, affluent]
          default: modest
        coin:
          type: integer
          minimum: 0
          default: 0
          description: Raw coin count for currency-economy regions.
        trade_goods:
          type: array
          items:
            type: string
          default: []
          description: Named barter items not tracked as equipment.
        obligations:
          type: array
          items:
            type: string
          default: []
          description: Debts, favors owed, or sworn financial duties.

    # ---------------------------------------------------------------------------
    # Politics (v3.1.0)
    # ---------------------------------------------------------------------------

    Politics:
      type: object
      description: >
        World-level relational and political state. Not a subsystem —
        a lightweight store for the GPT to track active political context.
        Update when faction obligations, legal standing, or active tensions change.
      properties:
        faction_memberships:
          type: array
          items:
            type: string
          default: []
          description: Factions the party formally belongs to.
        active_obligations:
          type: array
          items:
            type: string
          default: []
          description: Current political duties or oaths.
        legal_standing:
          type: string
          default: unknown
          description: e.g. "exile", "citizen", "wanted", "unknown".
        known_leverage:
          type: array
          items:
            type: string
          default: []
          description: Secrets or leverage the party holds over others.
        active_tensions:
          type: array
          items:
            type: string
          default: []
          description: Ongoing faction conflicts relevant to the party.
        conclave_status:
          type: string
          enum: [pending, active, concluded, unknown]
          default: unknown
          description: Status of the Draconic Conclave — a major political anchor.

    # ---------------------------------------------------------------------------
    # World model (updated v3.1.0)
    # ---------------------------------------------------------------------------

    WorldModel:
      type: object
      required: [location, threat, goal, turn]
      properties:
        location:
          type: string
          description: Current location ID
        threat:
          type: string
          description: Current primary threat
        goal:
          type: string
          description: Current objective
        turn:
          type: integer
          minimum: 1
          default: 1
        # v3.1.0 additions
        companions:
          type: array
          items:
            $ref: "#/components/schemas/CompanionModel"
          default: []
          description: Active companions traveling with or known to the party.
        economy:
          $ref: "#/components/schemas/Economy"
        politics:
          $ref: "#/components/schemas/Politics"

    # ---------------------------------------------------------------------------
    # State
    # ---------------------------------------------------------------------------

    SaveStateRequest:
      type: object
      required: [character, world, log_entry]
      properties:
        character:
          $ref: "#/components/schemas/CharacterModel"
        world:
          $ref: "#/components/schemas/WorldModel"
        log_entry:
          type: string
          description: >
            One in-world sentence capturing what materially changed this turn.

    GameStateResponse:
      type: object
      properties:
        session_id:
          type: string
        character:
          type: object
        world:
          type: object
        log:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
          nullable: true

    # ---------------------------------------------------------------------------
    # Session
    # ---------------------------------------------------------------------------

    AdjustmentPoints:
      type: object
      description: >
        Player's +5 domain adjustment pool. Max +3 per domain.
        Total must not exceed 5.
      properties:
        power:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        agility:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        perception:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        endurance:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        intellect:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        will:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        presence:
          type: integer
          minimum: 0
          maximum: 3
          default: 0

    NewSessionRequest:
      type: object
      required: [character_name, species, focus, background]
      properties:
        character_name:
          type: string
        species:
          type: string
          description: Species index from GET /options
        focus:
          type: string
          description: Focus archetype index from GET /options
        background:
          type: string
          description: Background index from GET /options
        adjustment_points:
          $ref: "#/components/schemas/AdjustmentPoints"
        starting_location:
          type: string
          default: unknown
        goal:
          type: string
          default: survive
        threat:
          type: string
          default: unknown
        # v3.1.0 additions
        identity:
          $ref: "#/components/schemas/Identity"
        starting_economy:
          $ref: "#/components/schemas/Economy"

    NewSessionResponse:
      type: object
      properties:
        session_id:
          type: string
        character:
          type: object
        world:
          type: object

    # ---------------------------------------------------------------------------
    # Character Creation
    # ---------------------------------------------------------------------------

    CreateCharacterRequest:
      type: object
      required: [session_id, name, species, focus, background]
      properties:
        session_id:
          type: string
        name:
          type: string
        species:
          type: string
        focus:
          type: string
        background:
          type: string
        adjustment_points:
          $ref: "#/components/schemas/AdjustmentPoints"
        # v3.1.0 addition
        identity:
          $ref: "#/components/schemas/Identity"

    CreateCharacterResponse:
      type: object
      properties:
        session_id:
          type: string
        character:
          type: object

    # ---------------------------------------------------------------------------
    # Dice
    # ---------------------------------------------------------------------------

    RollRequest:
      type: object
      required: [target]
      properties:
        target:
          type: integer
          description: >
            Assembled target number: domain score + knowledge tier + application tier + difficulty modifier.
            Clamped to 1–99 by the server.

    RollResponse:
      type: object
      properties:
        roll:
          type: integer
          description: Raw d100 result (1–100)
        target:
          type: integer
          description: The clamped target number
        success:
          type: boolean
          description: true if roll <= target
        margin:
          type: integer
          description: target - roll. Positive = succeeded by this much. Negative = failed by this much.
        degree:
          type: string
          enum: [critical_success, strong_success, success, partial_failure, failure, critical_failure]
          description: Degree of success band based on margin
        critical_success:
          type: boolean
          description: true if roll == 1
        critical_failure:
          type: boolean
          description: true if roll == 100

    # ---------------------------------------------------------------------------
    # Location
    # ---------------------------------------------------------------------------

    LocationData:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          default: unknown
        description:
          type: string
          default: ""
        tags:
          type: array
          items:
            type: string
          default: []
        connections:
          type: array
          items:
            type: string
          default: []
        threat_level:
          type: integer
          default: 0
        known_npcs:
          type: array
          items:
            type: string
          default: []
        discovered:
          type: boolean
          default: true

    LocationResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        data:
          type: object
        updated_at:
          type: string
          format: date-time
          nullable: true

    ConnectionInfo:
      type: object
      properties:
        to_id:
          type: string
        traversal:
          type: string
          nullable: true
        distance:
          type: string
          nullable: true

    ConnectionsResponse:
      type: object
      properties:
        from_id:
          type: string
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionInfo"

    # ---------------------------------------------------------------------------
    # Options
    # ---------------------------------------------------------------------------

    SpeciesOption:
      type: object
      properties:
        index:
          type: string
        name:
          type: string
        primary_domain:
          type: string
          nullable: true
        domains:
          type: object
          additionalProperties:
            type: integer

    FocusOption:
      type: object
      properties:
        index:
          type: string
        name:
          type: string
        description:
          type: string
        knowledge_tags:
          type: object
          additionalProperties:
            type: integer
        application_tags:
          type: object
          additionalProperties:
            type: integer

    BackgroundOption:
      type: object
      properties:
        index:
          type: string
        name:
          type: string
        description:
          type: string
        knowledge_tags:
          type: object
          additionalProperties:
            type: integer
        application_tags:
          type: object
          additionalProperties:
            type: integer

    OptionsResponse:
      type: object
      properties:
        species:
          type: array
          items:
            $ref: "#/components/schemas/SpeciesOption"
        focus:
          type: array
          items:
            $ref: "#/components/schemas/FocusOption"
        backgrounds:
          type: array
          items:
            $ref: "#/components/schemas/BackgroundOption"