openapi: 3.1.1
info:
  title: Mystic Weave
  description: >
    Persistent game state backend for a text-based RPG powered by a custom GPT.
    The GPT is the narrator and game master. This API is the memory.
    Uses d100 roll-under resolution with domain scores, knowledge tiers,
    and application tiers.
  version: 3.0.0

servers:
  - url: https://mysticweave-production.up.railway.app
    description: Production (Railway)

paths:

  /health:
    get:
      operationId: health
      summary: Health check
      description: Returns ok if the service is running.
      tags:
        - health
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: mystic-weave

  /options:
    get:
      operationId: getOptions
      summary: List supported species, focus archetypes, and backgrounds
      description: >
        Returns all supported species, focus archetypes, and backgrounds.
        Call before presenting creation choices. Only present options returned here —
        never enumerate from memory or training data.
      tags:
        - options
      responses:
        "200":
          description: Supported species, focus archetypes, and backgrounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionsResponse"

  /state/{session_id}:
    get:
      operationId: loadState
      summary: Load game state
      description: >
        Load the full game state for a session. Call this at the start of every
        session to restore character, world, and log history. Returns 404 if the
        session does not exist.
      tags:
        - state
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: The session identifier returned by POST /session/new
      responses:
        "200":
          description: Full game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStateResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: saveState
      summary: Save game state
      description: >
        Save the full game state after each turn and append a one-sentence log entry.
        Uses UPSERT — works for both first save and subsequent saves.
        Call this at the end of every turn without exception.
      tags:
        - state
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveStateRequest"
      responses:
        "200":
          description: State saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStateResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /session/new:
    post:
      operationId: newSession
      summary: Create a new game session
      description: >
        Creates a new session and seeds a character from the provided species,
        focus archetype, and background. Returns the session_id and initial state.
      tags:
        - session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewSessionResponse"
        "422":
          description: Invalid character options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /character/create:
    post:
      operationId: createCharacter
      summary: Re-seed a character into an existing session
      description: >
        Replaces the character in an existing session with a newly seeded character.
        The session must already exist.
      tags:
        - character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "200":
          description: Character created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCharacterResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid character options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /roll:
    post:
      operationId: rollDice
      summary: Authoritative d100 dice resolution
      description: >
        Roll 1d100 against the provided target number. The GPT assembles the target
        from domain score + knowledge tier + application tier + difficulty modifier,
        then sends it here. The server rolls. The GPT narrates. Returns the roll,
        success/failure, margin, and degree of success band.
      tags:
        - dice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollRequest"
      responses:
        "200":
          description: Roll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollResponse"

  /location/{id}:
    get:
      operationId: getLocation
      summary: Load location data
      description: >
        Load the full data for a location by ID. Call this before describing
        any location to the player. You may add sensory flavor but you may not
        contradict any field in the record.
      tags:
        - location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Location data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /location/{id}/connections:
    get:
      operationId: getLocationConnections
      summary: Get valid movement options
      description: >
        Returns the list of locations connected to the given location.
        Only present these as movement options — the player cannot move
        to unconnected locations.
      tags:
        - location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connected locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionsResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /location:
    post:
      operationId: upsertLocation
      summary: Create or update a location
      description: >
        Create a new location or update an existing one. Use this when
        discovering a new location or when updating details of a known location.
      tags:
        - location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationData"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"

components:
  schemas:

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string

    # ---------------------------------------------------------------------------
    # Character
    # ---------------------------------------------------------------------------

    HP:
      type: object
      required: [current, max]
      properties:
        current:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 1
          default: 100

    DomainScores:
      type: object
      required: [power, agility, perception, endurance, intellect, will, presence]
      properties:
        power:
          type: integer
          minimum: 1
          maximum: 60
        agility:
          type: integer
          minimum: 1
          maximum: 60
        perception:
          type: integer
          minimum: 1
          maximum: 60
        endurance:
          type: integer
          minimum: 1
          maximum: 60
        intellect:
          type: integer
          minimum: 1
          maximum: 60
        will:
          type: integer
          minimum: 1
          maximum: 60
        presence:
          type: integer
          minimum: 1
          maximum: 60

    CharacterModel:
      type: object
      required: [name, species, focus, background, hp, domains]
      properties:
        name:
          type: string
        species:
          type: string
          description: Species index (e.g. "human", "dragonborn")
        focus:
          type: string
          description: Focus archetype index (e.g. "devoted", "stalker")
        background:
          type: string
          description: Background index (e.g. "soldier", "acolyte")
        level:
          type: integer
          minimum: 1
          default: 1
        hp:
          $ref: "#/components/schemas/HP"
        domains:
          $ref: "#/components/schemas/DomainScores"
        knowledge:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 5
          default: {}
          description: >
            Knowledge tags. Keys are tag names (e.g. "discipline", "arcana"),
            values are tier numbers (1–5).
        application:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 5
          default: {}
          description: >
            Application tags. Keys are category names (e.g. "sacred_rites", "heavy_weapons"),
            values are tier numbers (1–5).
        status_effects:
          type: array
          items:
            type: string
          default: []
        notes:
          type: string
          default: ""

    # ---------------------------------------------------------------------------
    # World
    # ---------------------------------------------------------------------------

    WorldModel:
      type: object
      required: [location, threat, goal, turn]
      properties:
        location:
          type: string
          description: Current location ID
        threat:
          type: string
          description: Current primary threat
        goal:
          type: string
          description: Current objective
        turn:
          type: integer
          minimum: 1
          default: 1

    # ---------------------------------------------------------------------------
    # State
    # ---------------------------------------------------------------------------

    SaveStateRequest:
      type: object
      required: [character, world, log_entry]
      properties:
        character:
          $ref: "#/components/schemas/CharacterModel"
        world:
          $ref: "#/components/schemas/WorldModel"
        log_entry:
          type: string
          description: >
            One in-world sentence capturing what materially changed this turn.

    GameStateResponse:
      type: object
      properties:
        session_id:
          type: string
        character:
          type: object
        world:
          type: object
        log:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
          nullable: true

    # ---------------------------------------------------------------------------
    # Session
    # ---------------------------------------------------------------------------

    AdjustmentPoints:
      type: object
      description: >
        Player's +5 domain adjustment pool. Max +3 per domain. Total must not exceed 5.
      properties:
        power:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        agility:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        perception:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        endurance:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        intellect:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        will:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
        presence:
          type: integer
          minimum: 0
          maximum: 3
          default: 0

    NewSessionRequest:
      type: object
      required: [character_name, species, focus, background]
      properties:
        character_name:
          type: string
        species:
          type: string
          description: Species index from GET /options
        focus:
          type: string
          description: Focus archetype index from GET /options
        background:
          type: string
          description: Background index from GET /options
        adjustment_points:
          $ref: "#/components/schemas/AdjustmentPoints"
        starting_location:
          type: string
          default: unknown
        goal:
          type: string
          default: survive
        threat:
          type: string
          default: unknown

    NewSessionResponse:
      type: object
      properties:
        session_id:
          type: string
        character:
          type: object
        world:
          type: object

    # ---------------------------------------------------------------------------
    # Character Creation
    # ---------------------------------------------------------------------------

    CreateCharacterRequest:
      type: object
      required: [session_id, name, species, focus, background]
      properties:
        session_id:
          type: string
        name:
          type: string
        species:
          type: string
        focus:
          type: string
        background:
          type: string
        adjustment_points:
          $ref: "#/components/schemas/AdjustmentPoints"

    CreateCharacterResponse:
      type: object
      properties:
        session_id:
          type: string
        character:
          type: object

    # ---------------------------------------------------------------------------
    # Dice
    # ---------------------------------------------------------------------------

    RollRequest:
      type: object
      required: [target]
      properties:
        target:
          type: integer
          description: >
            Assembled target number: domain score + knowledge tier + application tier + difficulty modifier.
            Clamped to 1–99 by the server.

    RollResponse:
      type: object
      properties:
        roll:
          type: integer
          description: Raw d100 result (1–100)
        target:
          type: integer
          description: The target number that was sent
        success:
          type: boolean
          description: true if roll <= target (or roll == 1)
        margin:
          type: integer
          description: target - roll. Positive = succeeded by this much. Negative = failed by this much.
        degree:
          type: string
          enum: [critical_success, strong_success, success, partial_failure, failure, critical_failure]
          description: Degree of success band based on margin
        critical_success:
          type: boolean
          description: true if roll == 1
        critical_failure:
          type: boolean
          description: true if roll == 100

    # ---------------------------------------------------------------------------
    # Location
    # ---------------------------------------------------------------------------

    LocationData:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          default: unknown
        description:
          type: string
          default: ""
        tags:
          type: array
          items:
            type: string
          default: []
        connections:
          type: array
          items:
            type: string
          default: []
        threat_level:
          type: integer
          default: 0
        known_npcs:
          type: array
          items:
            type: string
          default: []
        discovered:
          type: boolean
          default: true

    LocationResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        data:
          type: object
        updated_at:
          type: string
          format: date-time
          nullable: true

    ConnectionInfo:
      type: object
      properties:
        to_id:
          type: string
        traversal:
          type: string
          nullable: true
        distance:
          type: string
          nullable: true

    ConnectionsResponse:
      type: object
      properties:
        from_id:
          type: string
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionInfo"

    # ---------------------------------------------------------------------------
    # Options
    # ---------------------------------------------------------------------------

    SpeciesOption:
      type: object
      properties:
        index:
          type: string
        name:
          type: string
        primary_domain:
          type: string
          nullable: true
        domains:
          type: object
          additionalProperties:
            type: integer

    FocusOption:
      type: object
      properties:
        index:
          type: string
        name:
          type: string
        description:
          type: string
        knowledge_tags:
          type: object
          additionalProperties:
            type: integer
        application_tags:
          type: object
          additionalProperties:
            type: integer

    BackgroundOption:
      type: object
      properties:
        index:
          type: string
        name:
          type: string
        description:
          type: string
        knowledge_tags:
          type: object
          additionalProperties:
            type: integer
        application_tags:
          type: object
          additionalProperties:
            type: integer

    OptionsResponse:
      type: object
      properties:
        species:
          type: array
          items:
            $ref: "#/components/schemas/SpeciesOption"
        focus:
          type: array
          items:
            $ref: "#/components/schemas/FocusOption"
        backgrounds:
          type: array
          items:
            $ref: "#/components/schemas/BackgroundOption"
