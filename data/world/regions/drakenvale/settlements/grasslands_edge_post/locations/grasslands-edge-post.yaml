summary: A windswept frontier post of watchtowers, wagon yards, ration sheds, and patrol
  stables at the point where open grassland traffic compresses into the stronghold-facing
  road. Caravans are inspected here, Dragon Guard riders rotate through in visible numbers,
  and most scenes should feel practical, exposed, and transit-driven rather than urban or
  ceremonial.
