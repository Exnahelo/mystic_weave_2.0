description: A descending terrace of sacred waters cascading down the southern face of the Stronghold, beginning as springs that well up through the platinum-veined Heartmass at the Platinum Heart far above and ending in the Southern Lake at the city's edge. The pool complex is a series of shallow terraces, channels, and reflecting basins cut into the fortress's outer stone, arranged so the water moves continuously but quietly. The Pools are used for ritual reflection, healing rites, and the long sacred practice of the Platinum Acolytes; they are also, simply, one of the most beautiful places in the realm. Residents come here to think, to grieve, to forgive, and to be still.
