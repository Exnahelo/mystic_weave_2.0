description: The high sanctum of Solveris at the summit of the Stronghold, an open circular platform of pale platinum-veined stone rising into the sky above the entire Hollow Crown. At its center burns the Platinum Flame, an eternal silver-white light that inspires righteousness and marks the sacred axis of the realm. The Sacred Pools begin here as clear water welling up from the stone itself before descending through the fortress. From the Heart's edge, the whole valley is visible — city, grasslands, lake, distant forests, and the ring of Alpine Peaks beyond. It is where the Oath of the Fallen was first sworn and where the Platinum Warden led the Accord in its founding oath.
