description: The Silent Grove's primary site for Heartwarden training — the focused working space where selected warriors undertake their seven-year training cycle under senior Heartwardens and druidic instructors. The Training Grounds hold the physical spaces for combat, movement, and endurance work; the quieter spaces for druidic field-reading and ambient-field practice; and the disciplined ritual spaces where specific Heartwarden observances occur. The Grounds operate at the Silent Grove's characteristic attentive-quiet register — training here is demanding but not loud, serious but not grim.
