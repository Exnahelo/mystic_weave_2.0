id: noble-groves
name: The Noble Groves
type: district
region_id: hollow-crown
parent_location_id: thornveil
description: Thornveil's ring of noble family estates, set outside the Heartwood Approach in mature old-growth terrain. Each noble house maintains a grove — a grouping of ancient trees, grown residences, working halls, and garden spaces held across generations according to the family's own traditions. The boundaries between groves are known rather than marked, and the district overall reads as a single continuous old-growth zone with different architectural idioms nested within it. Greenshield headquarters occupies a traditional military-family estate in this district. Several dozen families hold recognized groves; the system is fluid over elven timescales in ways realm equivalents are not.
