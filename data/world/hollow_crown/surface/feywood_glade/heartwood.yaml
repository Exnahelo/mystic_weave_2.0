description: The living heart of the Feywood Glade and the land it sustains. The Heartwood is an ancient tree of extraordinary scale, standing at the Glade's sacred center within the elven city of Thornveil that has grown up around it as its civic protector. The tree is not a sacred site in the sense of a built shrine or consecrated structure; it IS the sacred center, the source and focus of the Glade's magical vitality, the anchor from which the land's responses to its inhabitants flow. Elves born in the Glade greet the Heartwood in passing throughout their lives. Heartwardens take their sworn oaths at its base. The Council of Elders meets at the Heartwood for decisions of weight that require the land's direct attention. Its canopy reaches above Thornveil's rooflines; its trunk is broader than any assembly of humans could encircle; its roots extend through the earth in patterns that druids understand and realm scholars do not. The Heartwood is the Glade and the Glade is the Heartwood. Their
  health is one health. Their protection is one protection.
