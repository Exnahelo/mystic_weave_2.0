description: A quarry settlement in the Inner Ramparts and alpine foothill transition, supplying cut stone and mineral output to the Stronghold and basin infrastructure. Stonemark is built from its own product — low, dense, wind-resistant stonework. Quarry cuts run deep along old fracture belts, sometimes intersecting crystal-bearing layers contested with Deephollow-linked claims. The population is predominantly dwarf and human, with many quarry-master lines long established. Work here is physical, well-paid, and culturally tied to durable construction across the Hollow Crown.
