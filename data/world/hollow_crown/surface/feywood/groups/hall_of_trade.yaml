id: hall-of-trade
name: The Hall of Trade
type: order
region_id: hollow-crown
parent_location_id: vaelmere
description: >
  The Feywood's primary trade organization. The Hall of Trade is the
  institutional structure that handles the operational flow of goods
  between the Feywood and the realm — Border exchanges, inventory and
  distribution, the Trade Envoy corps that presents at exchange windows,
  the warehouse and logistics work that supports sustained external
  commerce. The Hall is led by the Trade Master, based at Vaelmere's
  Trade Hall building, with distributed operations at the Border, at
  Thornveil for high-level coordination, and across the broader Feywood
  for inbound-goods distribution. House Vaelaryn is overrepresented at
  all levels and disproportionately at the Trade Master role through
  generational trade-diplomacy tradition; the Hall is not house-bound.
  Approximately one hundred fifty to one hundred eighty active members
  operate across the Hall's posts. The Hall is a trade body, not an
  intelligence service; it accumulates awareness of realm conditions
  through the natural work of sustained trade contact rather than
  through any formal information-gathering function.
