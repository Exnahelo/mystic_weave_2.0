id: common-hearth
name: The Common Hearth
type: district
region_id: hollow-crown
parent_location_id: thornveil
description: >
  Thornveil's largest and most populous district — the general elven population's
  residential and social heart. Most Thornveil residents live here, in clustered
  dwelling arrangements of extended families and neighbor-groups with shared
  garden spaces and common-use buildings. The Common Hearth handles ordinary
  civic life: daily routine, market exchange, junior craftwork, informal
  community observance, and the continuous social tissue that binds elven life
  together at the city scale. Clusters range from four or five dwellings to
  twenty or more. The district is the part of Thornveil realm visitors
  experience when they experience Thornveil; it is also where most of
  Thornveil's humor, casual conversation, and everyday beauty lives.
