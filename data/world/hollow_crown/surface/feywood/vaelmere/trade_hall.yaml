id: trade-hall
name: The Trade Hall
type: location
region_id: hollow-crown
parent_location_id: vaelmere
description: Vaelmere's primary mercantile institution and the functional heart of the Feywood-realm trade relationship. The Trade Hall receives elven goods from across the Feywood for outbound Border exchange, receives realm goods from the Border for inbound distribution to Thornveil and the broader Feywood, and maintains the inventory, quality-standard, and scheduling infrastructure the trade flow requires. The Trade Master's offices occupy the Hall; the Council-appointed Trade Envoy corps is staffed and trained here. Realm traders conducting sustained business with the Feywood spend most of their Vaelmere time in and around the Trade Hall.
