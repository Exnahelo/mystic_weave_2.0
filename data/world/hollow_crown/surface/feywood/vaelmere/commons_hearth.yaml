description: Vaelmere's shared kitchen and dining space, the settlement's primary social anchor. Not mandatory — residents eat at home as well — but a significant daily-life institution where the community's social fabric concentrates and sustains itself. The Commons Hearth provides meals at communal scale for those who choose to eat here, hosts observance gatherings, serves as an informal civic common-space where residents mix across cluster and occupational lines, and offers realm visitors a more accessible point of social contact with Vaelmere than the Trade Hall or Warden's Hall provide.
