description: The realm-side threshold to the Feywood, where the road from Dracélune ends and the western temperate forest gives way to the Feywood's liminal territory. From outside, the Border shows as an ordinary forest edge — a line of older, taller, stranger trees standing somewhat differently than their realm-side neighbors, the ground beyond them shifting in quality in ways that a traveler notices without being able to name. There is no wall, no gate, no physical barrier. The Border is marked by stone waymarkers set in place over generations and by the small Hall of Guides station that manages sanctioned expedition traffic from here. The realm honors an ancient alliance with the Feywood; safe passage at the Border is reserved for those with guide sanction or elven welcome; unsanctioned entry is tolerated but genuinely consequential. Travelers who cross without preparation rarely return as they departed, and some do not return at all.
