description: The living heart of the Feywood and the source of the liminal field that protects it. The Heartwood is an ancient, conscious tree of extraordinary scale, standing at the Feywood's sacred center within the elven city of Thornveil that has grown up around it as its civic protector. It was discovered, not made — found by an elf adjacent to the Silent Grove community in the deep past, after the elves had given their immortality to heal the land and the first trees of the valley had risen from that sacrifice. House Heartwood takes its name from the tree it did not own. The Heartwood does not control the Feywood; it communicates with the land and the lives within it, sustaining the protective geometry of the Feywood and reading the intent of those who cross into the field. Its roots extend through the Hollow Crown's ecosystem in patterns that determine how the Feywood expels the unwelcome and shelters the trusted. Beneath its base, accessed through the buttress roots, lies the Council Chamber and the Pool — the site of the Heartwood's rare direct communication with people. The Heartwood is the Feywood and the Feywood is the Heartwood. Their health is one health.
