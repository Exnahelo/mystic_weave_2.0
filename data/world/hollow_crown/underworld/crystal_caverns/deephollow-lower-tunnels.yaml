description: The unmapped tunnel network beneath Deephollow extending into the deeper Crystal Caverns. The lower tunnels are not part of the city's operations — they are where the crystal veins go when the mining operations stop following them. The psionic resonance intensifies significantly in the lower sections. Long-term exposure without protection produces disorientation, hallucination, and in extreme cases permanent cognitive effects. The Deephollow Mining Authority has standing orders not to push new extraction beyond the marked lower boundary. Those orders are not always followed.
