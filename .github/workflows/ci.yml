name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-unit-contract:
    name: Lint + Unit + Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check api core tests

      - name: OpenAPI drift check
        run: python scripts/check_openapi_drift.py

      - name: Validate game data files
        run: python scripts/validate_data_files.py

      - name: Validate prompt files
        run: python scripts/validate_prompts.py

      - name: Unit + contract tests
        run: pytest -q tests/unit tests/contract

  integration-loop:
    name: Integration + Loop Test
    runs-on: ubuntu-latest
    needs: lint-unit-contract

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: railway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d railway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/railway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start API server
        run: |
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          cat /tmp/uvicorn.log
          exit 1

      - name: Run loop test
        run: python tests/loop_test.py
