name: Production Contract Verify

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

jobs:
  verify-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify production contract/options/version
        env:
          PROD_BASE_URL: https://mysticweave-production.up.railway.app
        run: |
          python scripts/verify_production_contract.py "$PROD_BASE_URL"
