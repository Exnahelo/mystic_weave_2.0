name: Production Contract Verify

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to verify"
        required: false
        default: "https://mysticweave-production.up.railway.app"
      run_smoke_bundle:
        description: "Also run predeploy smoke bundle against target"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 6 * * *"

jobs:
  verify-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify production contract/options/version
        env:
          PROD_BASE_URL: ${{ inputs.base_url || 'https://mysticweave-production.up.railway.app' }}
        run: |
          python scripts/verify_production_contract.py "$PROD_BASE_URL"

      - name: Optional smoke bundle
        if: ${{ inputs.run_smoke_bundle == true }}
        env:
          PROD_BASE_URL: ${{ inputs.base_url || 'https://mysticweave-production.up.railway.app' }}
        run: |
          python scripts/predeploy_smoke_bundle.py "$PROD_BASE_URL"
