name: Pre-Deploy Verification Bundle

on:
  pull_request:
  workflow_dispatch:

jobs:
  predeploy-bundle:
    name: Pre-Deploy Contract + Smoke Bundle
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: railway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d railway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/railway

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Contract + content guards
        run: |
          python scripts/check_openapi_drift.py
          python scripts/validate_data_files.py
          python scripts/validate_prompts.py

      - name: Unit/contract/regression tests
        run: pytest -q tests/unit tests/contract tests/regression/test_endpoint_validation.py tests/regression/test_multi_turn_persistence.py

      - name: Start API server
        run: |
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          cat /tmp/uvicorn.log
          exit 1

      - name: Run pre-deploy smoke bundle
        run: python scripts/predeploy_smoke_bundle.py http://127.0.0.1:8000

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: predeploy-server-log
          path: /tmp/uvicorn.log
