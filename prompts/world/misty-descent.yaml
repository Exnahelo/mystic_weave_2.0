description: Below the wardline, the mountain slope drops steeply through dense, rolling fog. The temperature shifts — alpine cold giving way to an unnatural warmth that rises from the valley below. Visibility drops to thirty feet. The mist is not weather; it is the outermost influence of the Mystic Wetlands bleeding upslope. Glowing pools collect in rock hollows along the path, their water faintly restorative. Sounds carry strangely — footsteps echo, voices seem to come from the wrong direction. Will-o'-wisps have been seen here, drifting through the fog with their own alien purpose.
