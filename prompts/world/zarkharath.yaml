description: The forge city of the Volcanic Highlands, built into the slopes beneath Zarkeros's lair. Zarkharath is loud, hot, and perpetually productive. Smoke from the Infernal Forge Guild's operations hangs over the settlement at all hours. The population is predominantly dragonborn and dwarf, with a significant number of kobold laborers working the deeper forge levels. Everything here is built around fire, metal, and output. The Draconic Council's authority is present but deferential to Zarkeros — in Zarkharath, his word carries more weight than any charter. Trade flows outward in finished weapons, armor, enchanted tools, and raw processed ore. Raw materials flow inward from Cinderpit and the surrounding Highlands.
