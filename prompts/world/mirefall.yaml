description: A dreamlike wetland settlement in the southwestern low basin, where fog collects and the boundary between the physical world and something else feels thinner than it should. Mirefall is built on elevated platforms and linked walkways above the wetland floor — ground construction is impractical and often unsafe. Its mixed population includes diviners, herbalists, wetland guides, and scholars of basin drainage and magical water behavior. Trade centers on rare herbs, restorative compounds, and information. The SSTC maintains a small factor presence for wetland-goods export.
