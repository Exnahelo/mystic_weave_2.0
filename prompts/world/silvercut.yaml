description: A logging settlement in the Temperate Forest built around the careful, Council-sanctioned harvesting of silverwood timber. Silvercut operates under strict Ptarian Code guidelines — every tree felled requires a replanting record filed with the Circle of Artisans, and operations are audited twice yearly. The population takes this seriously not out of fear but because the forest is their livelihood and they have watched what happens to settlements that overextract. Silverwood timber is among the most valuable mundane building materials in Drakenvale — its magical properties make it irreplaceable for enchanted construction and arcane implements. The SSTC manages export logistics from a yard on the settlement's eastern edge. Silvercut is quiet, well-organized, and deeply connected to the forest around it.
