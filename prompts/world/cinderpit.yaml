description: An ore extraction settlement on the lower slopes of the Volcanic Highlands, feeding raw materials to Zarkharath's forge operations. Cinderpit is not comfortable — the air carries sulfur, the ground is warm underfoot, and the work is dangerous. The population stays because the pay is the best in the valley for unskilled labor, and because the community that has grown up around shared hardship is real. Ore veins here produce iron, copper, and occasional fire-infused minerals that are worth significantly more than their mundane counterparts. The Infernal Forge Guild manages extraction contracts and maintains a supervisor presence. Safety standards are enforced not out of Council mandate but because Zarkeros made clear once that losing workers to preventable accidents was a waste he would not tolerate.
