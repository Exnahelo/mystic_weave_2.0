id: lastmark
name: Lastmark
type: waystation
description: >-
  A high approach waystation in one of the more stable Inner Rampart sectors beneath the Alpine
  Peaks. Lastmark is small, functional, and built low against wind and stonefall: a stable, a
  depot, an inn, and guide housing for difficult routes. Everyone passing through is either
  descending toward the basin core or climbing toward dangerous outer approaches. The permanent
  population is small - guides, outfitters, a healer, and a few long-settled families. The Dragon
  Guard maintains a rotating post here. It is a major resupply node for high-route movement.
