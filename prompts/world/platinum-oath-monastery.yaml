name: Platinum Oath Monastery
type: monastery
description: |-
  A fortified monastery built into a natural rock shelf overlooking the Rift of Discord, occupying one of the most geographically defensible positions in Drakenvale. Three sides are sheer cliff face. The fourth is a single narrow approach road that has never been taken by force. The monastery has stood since the final days of the Discordant War - constructed in the months after the Platinum Warden's sacrifice by the surviving members of the Platinum Accord who refused to scatter and refused to forget.

  Officially the monastery is a Rift monitoring station operated by an independent religious order with Warden cooperation. That description is accurate as far as it goes. What it omits is that the order is the Platinum Accord - not dissolved, not faded, but reduced and deliberate. They call themselves the Vigil internally. To the rest of the valley they are simply the monks of Platinum Oath. The Draconic Council knows what they are. The arrangement suits everyone. The Accord watches the thing that killed their founder. The Council has plausible distance from an organization whose methods are occasionally outside the Code's strict boundaries.

  The Platinum Warden is buried here. His tomb is in the deepest interior chamber, accessible only to members of the Vigil and Warden candidates who have completed the monastery's training arc. The tomb is not a shrine in the public sense - there are no pilgrimages, no ceremonial access. It is a working space. The Warden's sacrifice created a divine resonance that the monks have spent a century learning to use for Rift stability monitoring. His death is not commemorated. It is maintained.

  The military function is real and significant. The Wardens send their most promising candidates here for the final stage of elite training. The Rift perimeter is the training ground - chaos energy, spatial instability, and psychic pressure that cannot be simulated elsewhere in the valley. Candidates who complete the full training arc are marked with a small platinum scale tattoo on the inside of the left wrist. Those who know what it means know not to underestimate the person wearing it. Not every candidate completes the arc. Some wash out. Some do not return from perimeter exercises. The monastery records their names and the Warden keeps the count.

  The current leader of the Vigil is a tiefling monk of indeterminate age known as Serevane - one of the longest-serving members of the surviving Accord, old enough to have known the Platinum Warden personally, quiet enough that most people outside the monastery have never heard her name. She does not seek attention. She seeks continuity. The prophecy that speaks of the Platinum Warden's spirit rising again in Drakenvale's greatest hour is not something she discusses with outsiders. It is something she prepares for.

  Trade and supply come up the approach road from Greymantle and the Rift of Discord Edge - an uncomfortable arrangement that the monastery tolerates because Greymantle is the closest settlement and the monks are pragmatic. Greymantle's residents have learned not to cause problems on the road. The Vigil has made this point once, clearly, and has not needed to make it again.
