description: A war-scar chasm of unstable magical energy adjacent to the Shadowed Hollows, created during the Discordant War when a rogue faction sought to unseal the Temple to Tiamat. The Rift is not a dungeon — it is a wound. Chaotic energy crackles along its edges. Spells cast near it behave unpredictably. The chasm is deep enough that the bottom is not visible. It is not the Temple itself and not the meteor’s original wound. Proximity to the Hollows means necrotic and chaotic energies interact and reinforce each other here. If the Temple’s seal weakens, the Rift destabilizes first — an early warning for those trained to read it.
