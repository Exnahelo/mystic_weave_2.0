description: A prosperous western threshold town at the edge of the Feywood Glade, where dragonborn merchants, fey traders, humans, and wanderers converge. Dracélune sits in the forest-facing trade corridor between the central basin routes and the Feywood threshold. Its economy runs on Feywood goods, rare herbs, enchanted materials, and liminal exchange. The Dragon Guard maintains a light but visible presence, while informal observers and a functioning underworld shape the town beneath the surface. Loud, warm, unhurried, and quietly watchful, Dracélune is where order, trade, and ambiguity meet.
