description: "A volcanic fortress carved deep into the northeastern crater wall, in the heart of the Volcanic Highlands. Rivers of molten lava flow through channels cut into the chamber floors, their light the primary illumination — orange and red, casting everything in heat and shadow. Columns of glowing magma rise along the walls. The obsidian floors are veined with cracks that pulse with intense heat. The air is thick with ash and sulfur. There is nothing decorative here. Every surface serves a purpose: weapon racks, forging alcoves, strategy tables scarred by years of use. Zarkeros does not receive guests — he permits them entry, and the distinction is not subtle. The terrain alone communicates what is expected of those who stand in his hall."
