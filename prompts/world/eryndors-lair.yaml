description: "A golden sanctum carved into the northern crater wall, above and behind the Sacred Pools. Draconic carvings of Bahamut's teachings line the walls in bas-relief — scenes of judgment, mercy, and protection rendered in meticulous detail. At the heart of the chamber burns an eternal golden brazier, its flame never extinguished, its light warm and unwavering. The air carries the faint scent of incense and something older — a divine presence that settles over visitors like a hand on the shoulder. The lair exudes calm authority. Eryndor receives guests here when the matter is too significant for the Draconic Hall and too personal for the Platinum Heart. The chamber is sized for an ancient dragon; mortals and dragonborn feel appropriately small."
