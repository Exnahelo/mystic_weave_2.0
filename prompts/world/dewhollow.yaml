description: A small Temperate Forest settlement built around the harvesting and preparation of magical flora. Dewhollow's population is predominantly elven and gnomish — people with the patience and attunement required for careful botanical work. The settlement supplies dried herbs, prepared components, raw magical plant materials, and refined extracts to the Arcane Conservatory, the Platinum Acolytes, and the SSTC's external trade operation. Every harvester here works under Ptarian Code protocols similar to Silvercut's timber guidelines — sustainable extraction, seasonal rotation, and documentation. Dewhollow is quiet and smells extraordinary. Visitors sometimes find themselves staying longer than intended, which the residents attribute to the air quality and which may not be entirely wrong.
