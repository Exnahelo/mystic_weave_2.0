description: A stream fed by snowmelt from the peaks above, spanned by a weathered stone bridge of ancient construction. The water runs clear and painfully cold, carrying faint traces of latent magic downstream toward the valley. Everfrost Moss carpets the rocks along the banks. The bridge offers a natural rest point — sheltered enough to catch breath, exposed enough that nothing can approach unseen. Giant eagles circle high above, and winter wolf tracks mark the muddy banks.
